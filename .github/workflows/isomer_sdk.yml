name: Isomer SDK
# Isomer's Swift SDKs (sdk/build.sh): Android's (aarch64, x86_64 and armv7 in
# one bundle) and WebAssembly's (wasm32-unknown-wasip1), each plain and -i18n
# (FoundationInternationalization and the SDK's ICU in Foundation). Each
# build checks its SDK (the client, and sdk/check's autolink, pairing and
# undefined) and fails on any of them (sdk/README.md).
#
# - each push to an isomer-* branch: the four SDKs built and checked, kept
#   as artifacts for a day.
# - by hand (`run: release`, on the release branch, isomer-<Swift
#   version>), as isomer's release runs are (AttilaTheFun/reviews'
#   docs/RELEASE_PROCESS.md): the SDKs built and checked, then a consumer
#   built against them as a consumer fetches them, by URL and sha256 (isomer
#   main's tests/sdk_consumer and tools/ci/sdk_smoke, the SDKs served from
#   the job: a draft's assets need a token), plain and -i18n at API 23 and
#   28, upgraded from the SDKs isomer registers now in one output base, its
#   x86_64 APK run on an emulator at the cell's API; then a draft release
#   with the SDKs and their .sha256 files (sdk-check draft: its version from
#   the repository's releases and tags, its notes the checks that passed,
#   the checksums and the consumer's lines). The owner publishes it in
#   Reviews, which makes its tag, isomer-<Swift version>.N. No agent
#   publishes a release or makes a tag.
#
# Actions pinned by commit, the images by digest; only the release job can
# write.
on:
  push:
    branches: ['isomer-*']
  workflow_dispatch:
    inputs:
      run:
        description: "What to run: build (the SDKs, built and checked), or release on the release branch (built, checked, a consumer built and run against them, and a draft release)"
        type: choice
        options: [build, release]
        default: build
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  sdk:
    strategy:
      fail-fast: false
      matrix:
        sdk: [android, android-i18n, wasm, wasm-i18n]
    runs-on: ubuntu-24.04-arm
    # The image the builds were checked in (Swift's libraries, unzip, git):
    # ghcr.io/attilathefun/visor-agent:0.41.2.
    container: ghcr.io/attilathefun/visor-agent@sha256:849dcf6aeb16119e3b769b4f0c410b93ac58ed1e3b3ef2801f7534def3fbaaf0
    timeout-minutes: 120
    steps:
      # The whole history: the pack step takes the bundle's times from the
      # last commit to what goes into it (git log -- <paths>), which a
      # shallow clone's one commit would answer with its own.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # Its checks' PASS lines kept for the draft's notes.
      - run: |
          sdk/build.sh ${{ matrix.sdk }} --out="$RUNNER_TEMP/sdk" 2>&1 | tee "$RUNNER_TEMP/build.log"
          mkdir -p "$RUNNER_TEMP/results" && grep '^PASS' "$RUNNER_TEMP/build.log" | sed 's/^/${{ matrix.sdk }}: /' > "$RUNNER_TEMP/results/sdk-${{ matrix.sdk }}.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: isomer-${{ matrix.sdk }}-sdk
          path: ${{ runner.temp }}/sdk/
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: results-sdk-${{ matrix.sdk }}
          path: ${{ runner.temp }}/results/
          retention-days: 1

  # A consumer of the SDKs just built, as an app fetches them: isomer main's
  # tests/sdk_consumer at isomer main, first with the SDKs isomer registers
  # now (examples/MODULE.bazel's, at API 28), then upgraded in the same
  # output base to these, served by URL from the job (busybox's httpd: a
  # draft's assets need a token), at the cell's API (isomer's
  # docs/hermetic_toolchains.md, "The SDKs' checks").
  # `bazel run --symlink_prefix=/`: no convenience symlinks at isomer's root,
  # where its Package.swift's Isomer target (path ".") would take the
  # examples' .lproj under them for resources and `swift package describe`
  # fail.
  # `build --bazel-arg=--symlink_prefix=/`: none in tests/sdk_consumer either,
  # which rules_swift_package_manager copies with isomer's package into the
  # consumer's output base (a link into that output base can't be copied).
  smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.run == 'release' && startsWith(github.ref, 'refs/heads/isomer-')
    needs: sdk
    strategy:
      fail-fast: false
      matrix:
        variant: [plain, i18n]
        api: [23, 28]
    runs-on: ubuntu-24.04
    container:
      image: swift:6.4.2-noble@sha256:23d9b28ad97fb1cf1999edc3a0cb265ee915ed42299a9344e7173d5a6d2b05f4
      volumes: ["/mnt:/mnt"]
    timeout-minutes: 120
    env:
      ISOMER_PLATFORMS: android
    # isomer's checkout in isomer/, every step run there: the consumer, the
    # cell's --isomer and examples/MODULE.bazel are isomer's, never this
    # repository's.
    defaults:
      run:
        shell: bash
        working-directory: isomer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: AttilaTheFun/isomer
          ref: main
          path: isomer
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: isomer-*-sdk
          merge-multiple: true
          path: ${{ runner.temp }}/sdk
      - name: The job's tools, and the SDKs served
        run: |
          tools/ci/job_tools.sh && apt-get install -y -qq busybox > /dev/null
          busybox httpd -p 127.0.0.1:8000 -h "$RUNNER_TEMP/sdk"
      - name: The consumer with the SDKs isomer registers now
        run: |
          bazel run --symlink_prefix=/ //tools/ci/sdk_smoke -- cell --isomer "$PWD" --sdk-base-url "$(sed -n 's|^ *url = "\(.*\)/swift-6.4.2-RELEASE_android.*|\1|p' examples/MODULE.bazel | head -1)" --variant ${{ matrix.variant }} --api 28
          bazel run --symlink_prefix=/ //tools/ci/sdk_smoke -- build --bazel-arg=--symlink_prefix=/ --bazel-arg=--experimental_repository_downloader_retries=3 --no-apks --no-wasm --startup-arg=--output_base=/mnt/consumer
      - name: Upgraded to these SDKs, by URL
        run: |
          cell="--isomer $PWD --sdk-base-url http://127.0.0.1:8000 --variant ${{ matrix.variant }} --api ${{ matrix.api }}"
          retries=--bazel-arg=--experimental_repository_downloader_retries=3
          { bazel run --symlink_prefix=/ //tools/ci/sdk_smoke -- cell $cell && bazel run --symlink_prefix=/ //tools/ci/sdk_smoke -- build --bazel-arg=--symlink_prefix=/ $retries --startup-arg=--output_base=/mnt/consumer &&
            bazel run --symlink_prefix=/ //tools/ci/sdk_smoke -- cell $cell --rules-android 0.7.3 && bazel run --symlink_prefix=/ //tools/ci/sdk_smoke -- build --bazel-arg=--symlink_prefix=/ $retries --no-wasm --out "$GITHUB_WORKSPACE/out/apk" --startup-arg=--output_base=/mnt/consumer; } | tee "$RUNNER_TEMP/smoke.log"
          mkdir -p "$GITHUB_WORKSPACE/out/results" && grep '^PASS' "$RUNNER_TEMP/smoke.log" | sort -u | sed 's/^/consumer, ${{ matrix.variant }}, API ${{ matrix.api }}: /' > "$GITHUB_WORKSPACE/out/results/smoke-${{ matrix.variant }}-${{ matrix.api }}.txt"
          cp tests/sdk_consumer/cell.bzl "$GITHUB_WORKSPACE/out/apk/"
      # Uploaded from the workspace (paths relative to it): in a container
      # job ${{ runner.temp }} names the runner's directory, not the
      # container's /__w/_temp, and of two such paths only one was found.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: results-smoke-${{ matrix.variant }}-${{ matrix.api }}
          path: out/results/
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-apk-${{ matrix.variant }}-${{ matrix.api }}
          path: out/apk/
          retention-days: 1

  # Each cell's x86_64 APK on an emulator at its API, on GitHub's KVM
  # (isomer's tools/ci/hosted_android_emulator.sh, the API's AOSP image).
  smoke-android:
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        variant: [plain, i18n]
        api: [23, 28]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: isomer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: AttilaTheFun/isomer
          ref: main
          path: isomer
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: smoke-apk-${{ matrix.variant }}-${{ matrix.api }}
          path: out/apk
      # sdk_smoke is built here, on the runner itself (the emulator wants its
      # KVM): its FoundationNetworking links libcurl, whose development
      # package the runner's image hasn't.
      - name: The tool's libcurl
        run: sudo apt-get install -y -qq libcurl4-openssl-dev > /dev/null
      - name: The emulator at API ${{ matrix.api }}
        run: |
          cp "$GITHUB_WORKSPACE/out/apk/cell.bzl" tests/sdk_consumer/
          tools/ci/hosted_android_emulator.sh "$RUNNER_TEMP/emulator.log" "$RUNNER_TEMP/serial" "system-images;android-${{ matrix.api }};default;x86_64" < /dev/null > /dev/null
      - name: The checks on Android ${{ matrix.api }}
        run: |
          bazel run --symlink_prefix=/ //tools/ci/sdk_smoke -- run-android --adb "$ANDROID_HOME/platform-tools/adb" --serial "$(cat "$RUNNER_TEMP/serial")" --apk "$GITHUB_WORKSPACE/out/apk/smoke_x86_64.apk" | tee "$RUNNER_TEMP/run.log"
          mkdir -p "$GITHUB_WORKSPACE/out/results" && grep '^PASS' "$RUNNER_TEMP/run.log" | sed 's/^/consumer, ${{ matrix.variant }}: /' > "$GITHUB_WORKSPACE/out/results/emulator-${{ matrix.variant }}-${{ matrix.api }}.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: results-emulator-${{ matrix.variant }}-${{ matrix.api }}
          path: out/results/
          retention-days: 1

  # The draft release (sdk-check draft, sdk/check/Sources/sdk-check/Draft.swift):
  # the only job that writes.
  release:
    needs: [sdk, smoke, smoke-android]
    runs-on: ubuntu-24.04-arm
    container: ghcr.io/attilathefun/visor-agent@sha256:849dcf6aeb16119e3b769b4f0c410b93ac58ed1e3b3ef2801f7534def3fbaaf0
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: isomer-*-sdk
          merge-multiple: true
          path: ${{ runner.temp }}/sdk
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: results-*
          merge-multiple: true
          path: ${{ runner.temp }}/results
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          swift run --package-path sdk/check -c release sdk-check draft --assets "$RUNNER_TEMP/sdk" --results "$RUNNER_TEMP/results"
