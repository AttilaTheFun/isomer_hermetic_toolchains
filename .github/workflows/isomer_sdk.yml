name: Isomer SDK
# Isomer's Swift SDKs (sdk/build.sh): Android's (aarch64, x86_64 and armv7 in
# one bundle) and WebAssembly's (wasm32-unknown-wasip1), each plain and -i18n
# (FoundationInternationalization and the SDK's ICU in Foundation), and
# WebAssembly's threads SDK (wasm-threads, plain: wasm32-unknown-wasip1-threads
# beside wasm32-unknown-wasip1, its runtime built in the job from upstream's
# sources and sdk/patches by sdk-check build-threads-runtime). Each
# build checks its SDK (the client, and sdk/check's autolink, pairing and
# undefined) and fails on any of them (sdk/README.md).
#
# - each push to an isomer-* branch: the five SDKs built and checked, kept
#   as artifacts for a day.
# - by hand (`run: release`, on the release branch, isomer-<Swift
#   version>), as isomer's release runs are (AttilaTheFun/reviews'
#   docs/RELEASE_PROCESS.md): the SDKs built and checked, then a consumer
#   built against them as a consumer fetches them, by URL and sha256 (isomer
#   main's tests/sdk_consumer and tools/ci/sdk_smoke, the SDKs served from
#   the job: a draft's assets need a token), plain and -i18n at API 23 and
#   28, upgraded from the SDKs isomer registers now in one output base, its
#   x86_64 APK run on an emulator at the cell's API; then a draft release
#   with the SDKs and their .sha256 files (sdk-check draft: its version from
#   the repository's releases and tags, its notes the checks that passed,
#   the checksums and the consumer's lines). The owner publishes it in
#   Reviews, which makes its tag, isomer-<Swift version>.N. No agent
#   publishes a release or makes a tag.
# - by hand (`run: wine`, on any branch: its draft targets main's head), a
#   Wine release (sdk/README.md, "Wine"), never assembled by hand: Wine
#   Staging for arm64 built from sdk/wine/wine.json in Ubuntu 26.04 (whose
#   toolchain the build needs), the archive unpacked and checked in the same
#   container, its proof made (sdk-check wine-build, wine-check, wine-proof),
#   then compared with the last published wine-* release's (build_tools'
#   proof-diff) and drafted as wine-<version>-staging on main (sdk-check
#   wine-draft). New Container Helper checks the draft; the owner publishes
#   it in Reviews.
#
# Actions pinned by commit, the images by digest; only the release job can
# write.
#
# Bazel's caches, GitHub's (actions/cache), for the release run's smoke
# jobs, set up by isomer's tools/ci/ci_bazel.sh from the isomer checkout
# (its downloader.cfg: GitHub's downloads at GitHub and Bazel's mirror,
# Maven Central's at Central and Google's mirror):
# - the repository cache (downloads, each checked by its sha256): its
#   content_addressable files alone (the repository contents cache beside
#   it is many GB), without the candidate SDKs, which no later run fetches;
# - sdk_smoke's own build at isomer's root (its disk cache), by isomer's
#   graph;
# - the consumer's build with the SDKs isomer registers now (its disk
#   cache, only that build's), by everything that build is made of but
#   isomer's sources (content-addressed, they are its actions' inputs):
#   isomer's graph, the registered SDKs' URLs and sha256s
#   (examples/MODULE.bazel), the consumer's MODULE.bazel and Package.resolved,
#   the variant and the image. Restored by that exact key alone, never
#   saved after the upgrade. The upgraded builds, against the candidate SDKs,
#   have no disk cache: they are what the run proves (the upgrade in one
#   output base, as a consumer makes it), so each is built.
# A key is saved once, by whichever cell gets there first; GitHub's 10 GB a
# repository holds them: about 4 GB together (the downloads 2.3 GB
# compressed, each variant's consumer build 0.15 GB, sdk_smoke's 30 MB, the
# emulator jobs' tool and its downloads about 1 GB).
on:
  push:
    branches: ['isomer-*']
  workflow_dispatch:
    inputs:
      run:
        description: "What to run: build (the SDKs, built and checked), release on the release branch (built, checked, a consumer built and run against them, and a draft release), or wine (Wine Staging for arm64 built, checked and drafted as wine-<version>-staging on main)"
        type: choice
        options: [build, release, wine]
        default: build
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  sdk:
    # Not for a Wine release (`run: wine`), which builds no SDK.
    if: github.event_name == 'push' || inputs.run != 'wine'
    strategy:
      fail-fast: false
      matrix:
        sdk: [android, android-i18n, wasm, wasm-i18n, wasm-threads]
    runs-on: ubuntu-24.04-arm
    # The image the builds were checked in (Swift's libraries, unzip, git):
    # ghcr.io/attilathefun/visor-agent:0.41.2.
    container: ghcr.io/attilathefun/visor-agent@sha256:849dcf6aeb16119e3b769b4f0c410b93ac58ed1e3b3ef2801f7534def3fbaaf0
    timeout-minutes: 120
    steps:
      # The whole history: the pack step takes the bundle's times from the
      # last commit to what goes into it (git log -- <paths>), which a
      # shallow clone's one commit would answer with its own.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # Its checks' PASS lines kept for the draft's notes. (wasm-threads
      # installs cmake and ninja with apt when the image hasn't them, for its
      # runtime's build: the job runs as root.)
      - run: |
          sdk/build.sh ${{ matrix.sdk }} --out="$RUNNER_TEMP/sdk" 2>&1 | tee "$RUNNER_TEMP/build.log"
          mkdir -p out/results out/logs && grep '^PASS' "$RUNNER_TEMP/build.log" | sed 's/^/${{ matrix.sdk }}: /' > "out/results/sdk-${{ matrix.sdk }}.txt"
          cp "$RUNNER_TEMP/build.log" "out/logs/sdk-${{ matrix.sdk }}.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: isomer-${{ matrix.sdk }}-sdk
          path: ${{ runner.temp }}/sdk/
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: results-sdk-${{ matrix.sdk }}
          path: out/results/
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: logs-sdk-${{ matrix.sdk }}
          path: out/logs/
          retention-days: 1

  # A consumer of the SDKs just built, as an app fetches them: isomer main's
  # tests/sdk_consumer at isomer main, first with the SDKs isomer registers
  # now (examples/MODULE.bazel's, at API 28), then upgraded in the same
  # output base to these, served by URL from the job (busybox's httpd: a
  # draft's assets need a token), at the cell's API (isomer's
  # docs/hermetic_toolchains.md, "The SDKs' checks").
  # `bazel run --symlink_prefix=/`: no convenience symlinks at isomer's root,
  # where its Package.swift's Isomer target (path ".") would take the
  # examples' .lproj under them for resources and `swift package describe`
  # fail.
  # `build --bazel-arg=--symlink_prefix=/`: none in tests/sdk_consumer either,
  # which rules_swift_package_manager copies with isomer's package into the
  # consumer's output base (a link into that output base can't be copied).
  smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.run == 'release' && startsWith(github.ref, 'refs/heads/isomer-')
    needs: sdk
    strategy:
      fail-fast: false
      matrix:
        variant: [plain, i18n]
        api: [23, 28]
    runs-on: ubuntu-24.04
    container:
      image: swift:6.4.2-noble@sha256:23d9b28ad97fb1cf1999edc3a0cb265ee915ed42299a9344e7173d5a6d2b05f4
      volumes: ["/mnt:/mnt"]
    timeout-minutes: 120
    env:
      ISOMER_PLATFORMS: android
    # isomer's checkout in isomer/, every step run there: the consumer, the
    # cell's --isomer and examples/MODULE.bazel are isomer's, never this
    # repository's.
    defaults:
      run:
        shell: bash
        working-directory: isomer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: AttilaTheFun/isomer
          ref: main
          path: isomer
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: isomer-*-sdk
          merge-multiple: true
          path: ${{ runner.temp }}/sdk
      # apt from Azure's Ubuntu mirror, as GitHub's own images have it: from
      # archive.ubuntu.com this step took 9 to 12 minutes of each cell.
      - name: The job's tools, and the SDKs served
        run: |
          sed -i 's|http://archive.ubuntu.com/|http://azure.archive.ubuntu.com/|g' /etc/apt/sources.list.d/ubuntu.sources
          tools/ci/job_tools.sh && apt-get install -y -qq busybox > /dev/null
          busybox httpd -p 127.0.0.1:8000 -h "$RUNNER_TEMP/sdk"
      # Bazel's caches (the header): restored after job_tools.sh, which
      # installs zstd (a cache saved with zstd isn't found without it).
      - id: repository-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /mnt/cache/bazel/repository/content_addressable
          key: smoke-repository-${{ hashFiles('isomer/MODULE.bazel', 'isomer/examples/MODULE.bazel', 'isomer/*_install.json', 'isomer/tests/sdk_consumer/MODULE.bazel', 'isomer/tests/sdk_consumer/dep/MODULE.bazel', 'isomer/**/Package.resolved') }}
          restore-keys: smoke-repository-
      - id: tool-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /mnt/cache/bazel/disk
          key: smoke-tool-noble-23d9b28a-${{ hashFiles('isomer/.bazelversion', 'isomer/MODULE.bazel', 'isomer/**/Package.resolved') }}
      # The image's digest in the key (as `container:` names it): the host's
      # clang and libraries are the build's too.
      - id: previous-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /mnt/cache/previous
          key: smoke-previous-${{ matrix.variant }}-noble-23d9b28a-${{ hashFiles('isomer/.bazelversion', 'isomer/MODULE.bazel', 'isomer/examples/MODULE.bazel', 'isomer/*_install.json', 'isomer/**/Package.resolved', 'isomer/tests/sdk_consumer/**', 'isomer/tests/sdk_consumer/.bazelrc', 'isomer/tests/sdk_consumer/.bazelversion') }}
      - name: Bazel's settings
        run: tools/ci/ci_bazel.sh setup /mnt/cache/bazel
      # The one build with a disk cache of its own (--disk_cache here alone).
      - name: The consumer with the SDKs isomer registers now
        run: |
          { bazel run --symlink_prefix=/ //tools/ci/sdk_smoke -- cell --isomer "$PWD" --sdk-base-url "$(sed -n 's|^ *url = "\(.*\)/swift-6.4.2-RELEASE_android.*|\1|p' examples/MODULE.bazel | head -1)" --variant ${{ matrix.variant }} --api 28 &&
            bazel run --symlink_prefix=/ //tools/ci/sdk_smoke -- build --bazel-arg=--symlink_prefix=/ --bazel-arg=--experimental_repository_downloader_retries=3 --bazel-arg=--disk_cache=/mnt/cache/previous --no-apks --no-wasm --startup-arg=--output_base=/mnt/consumer; } | tee -a "$RUNNER_TEMP/smoke.log"
      # Saved here, before anything of the candidate SDKs is fetched, and only
      # after that build passed.
      - if: steps.previous-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /mnt/cache/previous
          key: ${{ steps.previous-cache.outputs.cache-primary-key }}
      - name: Upgraded to these SDKs, by URL
        run: |
          cell="--isomer $PWD --sdk-base-url http://127.0.0.1:8000 --variant ${{ matrix.variant }} --api ${{ matrix.api }}"
          retries=--bazel-arg=--experimental_repository_downloader_retries=3
          { bazel run --symlink_prefix=/ //tools/ci/sdk_smoke -- cell $cell && bazel run --symlink_prefix=/ //tools/ci/sdk_smoke -- build --bazel-arg=--symlink_prefix=/ $retries --startup-arg=--output_base=/mnt/consumer &&
            bazel run --symlink_prefix=/ //tools/ci/sdk_smoke -- cell $cell --rules-android 0.7.3 && bazel run --symlink_prefix=/ //tools/ci/sdk_smoke -- build --bazel-arg=--symlink_prefix=/ $retries --no-wasm --out "$GITHUB_WORKSPACE/out/apk" --startup-arg=--output_base=/mnt/consumer; } | tee -a "$RUNNER_TEMP/smoke.log"
          mkdir -p "$GITHUB_WORKSPACE/out/results" && grep '^PASS' "$RUNNER_TEMP/smoke.log" | sort -u | sed 's/^/consumer, ${{ matrix.variant }}, API ${{ matrix.api }}: /' > "$GITHUB_WORKSPACE/out/results/smoke-${{ matrix.variant }}-${{ matrix.api }}.txt"
          cp tests/sdk_consumer/cell.bzl "$GITHUB_WORKSPACE/out/apk/"
          mkdir -p "$GITHUB_WORKSPACE/out/logs" && cp "$RUNNER_TEMP/smoke.log" "$GITHUB_WORKSPACE/out/logs/smoke-${{ matrix.variant }}-${{ matrix.api }}.log"
      # Uploaded from the workspace (paths relative to it): in a container
      # job ${{ runner.temp }} names the runner's directory, not the
      # container's /__w/_temp, and of two such paths only one was found.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: results-smoke-${{ matrix.variant }}-${{ matrix.api }}
          path: out/results/
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-apk-${{ matrix.variant }}-${{ matrix.api }}
          path: out/apk/
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: logs-smoke-${{ matrix.variant }}-${{ matrix.api }}
          path: out/logs/
          retention-days: 1
      # sdk_smoke's build and the downloads, kept even when a build failed
      # (both are right whatever the consumer did). The candidate SDKs out of
      # the downloads first: no later run fetches these again.
      - if: ${{ !cancelled() && steps.tool-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /mnt/cache/bazel/disk
          key: ${{ steps.tool-cache.outputs.cache-primary-key }}
      - name: The downloads, without the candidate SDKs
        if: ${{ !cancelled() && steps.repository-cache.outputs.cache-hit != 'true' }}
        run: |
          for file in "$RUNNER_TEMP"/sdk/*.sha256; do rm -rf "/mnt/cache/bazel/repository/content_addressable/sha256/$(cut -d' ' -f1 "$file")"; done
          du -sh /mnt/cache/bazel/repository/content_addressable
      - if: ${{ !cancelled() && steps.repository-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /mnt/cache/bazel/repository/content_addressable
          key: ${{ steps.repository-cache.outputs.cache-primary-key }}

  # Each cell's x86_64 APK on an emulator at its API, on GitHub's KVM
  # (isomer's tools/ci/hosted_android_emulator.sh, the API's AOSP image).
  smoke-android:
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        variant: [plain, i18n]
        api: [23, 28]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: isomer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: AttilaTheFun/isomer
          ref: main
          path: isomer
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: smoke-apk-${{ matrix.variant }}-${{ matrix.api }}
          path: out/apk
      # sdk_smoke is built here, on the runner itself (the emulator wants its
      # KVM): its FoundationNetworking links libcurl, whose development
      # package the runner's image hasn't.
      - name: The tool's libcurl
        run: sudo apt-get install -y -qq libcurl4-openssl-dev > /dev/null
      # sdk_smoke's build (its disk cache) and its downloads, by isomer's
      # graph and the runner's image (its compilers and libraries are the
      # build's), set up by isomer's tools/ci/ci_bazel.sh (the header).
      - id: image
        run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - id: tool-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/sdk-smoke/disk
            ~/.cache/sdk-smoke/repository/content_addressable
          key: smoke-android-tool-${{ steps.image.outputs.version }}-${{ hashFiles('isomer/.bazelversion', 'isomer/MODULE.bazel', 'isomer/**/Package.resolved') }}
      - name: Bazel's settings
        run: tools/ci/ci_bazel.sh setup "$HOME/.cache/sdk-smoke"
      - name: The emulator at API ${{ matrix.api }}
        run: |
          cp "$GITHUB_WORKSPACE/out/apk/cell.bzl" tests/sdk_consumer/
          tools/ci/hosted_android_emulator.sh "$RUNNER_TEMP/emulator.log" "$RUNNER_TEMP/serial" "system-images;android-${{ matrix.api }};default;x86_64" < /dev/null > /dev/null
      - name: The checks on Android ${{ matrix.api }}
        run: |
          bazel run --symlink_prefix=/ //tools/ci/sdk_smoke -- run-android --adb "$ANDROID_HOME/platform-tools/adb" --serial "$(cat "$RUNNER_TEMP/serial")" --apk "$GITHUB_WORKSPACE/out/apk/smoke_x86_64.apk" | tee "$RUNNER_TEMP/run.log"
          mkdir -p "$GITHUB_WORKSPACE/out/results" && grep '^PASS' "$RUNNER_TEMP/run.log" | sed 's/^/consumer, ${{ matrix.variant }}: /' > "$GITHUB_WORKSPACE/out/results/emulator-${{ matrix.variant }}-${{ matrix.api }}.txt"
          mkdir -p "$GITHUB_WORKSPACE/out/logs" && cp "$RUNNER_TEMP/run.log" "$GITHUB_WORKSPACE/out/logs/emulator-${{ matrix.variant }}-${{ matrix.api }}.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: results-emulator-${{ matrix.variant }}-${{ matrix.api }}
          path: out/results/
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: logs-emulator-${{ matrix.variant }}-${{ matrix.api }}
          path: out/logs/
          retention-days: 1
      - if: ${{ !cancelled() && steps.tool-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/sdk-smoke/disk
            ~/.cache/sdk-smoke/repository/content_addressable
          key: ${{ steps.tool-cache.outputs.cache-primary-key }}

  # The draft release (sdk-check draft, sdk/check/Sources/sdk-check/Draft.swift):
  # the only job that writes.
  # It carries the run's proof, proof.zip (Reviews' format 2, sdk-check
  # proof: a tests item a target each SDK was checked for, a consumer's cell
  # and an emulator's, with the jobs' logs), which Reviews' Release waits for.
  release:
    needs: [sdk, smoke, smoke-android]
    runs-on: ubuntu-24.04-arm
    container: ghcr.io/attilathefun/visor-agent@sha256:849dcf6aeb16119e3b769b4f0c410b93ac58ed1e3b3ef2801f7534def3fbaaf0
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: isomer-*-sdk
          merge-multiple: true
          path: out/sdk
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: results-*
          merge-multiple: true
          path: out/results
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: logs-*
          merge-multiple: true
          path: out/logs
      # build_tools' proof-diff (a tagged release), for proof-diff.json.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: AttilaTheFun/build_tools
          ref: 3ce2a6b10df8e1fa0f41cc44378d67b8b5b5b6e4 # v0.2.0
          path: out/build_tools
      # The draft's version, its proof (sdk-check proof), the proof's
      # comparison with the release before (proof-diff, PROOF_TAG_PREFIX
      # isomer-), then the draft with all of it (sdk-check draft).
      - env:
          GH_TOKEN: ${{ github.token }}
          PROOF_TAG_PREFIX: isomer-
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          swift build --package-path sdk/check -c release && swift build --package-path out/build_tools -c release --product proof-diff
          version="$(sdk/check/.build/release/sdk-check version)"
          sdk/check/.build/release/sdk-check proof --logs out/logs --out out/proof --version "$version"
          out/build_tools/.build/release/proof-diff make out/proof/proof.zip
          sdk/check/.build/release/sdk-check draft --assets out/sdk --results out/results --proof out/proof

  # A Wine release (sdk/README.md, "Wine"; sdk/wine/wine.json): Wine Staging
  # for arm64 built, unpacked and checked, and its proof made, in Ubuntu
  # 26.04 (the image by digest), whose toolchain the build needs: about an
  # hour of make on 8 CPUs, so up to two on the runner's 4. sdk-check is
  # built by swift.org's toolchain for 26.04 (by sha256) in /opt/swift, off
  # Wine's PATH, with the recipe's development packages and only the
  # toolchain's runtime libraries besides, so Wine's configure finds what it
  # found by hand. Reads alone: the draft is wine-draft's.
  wine:
    if: github.event_name == 'workflow_dispatch' && inputs.run == 'wine'
    runs-on: ubuntu-24.04-arm
    container: docker.io/library/ubuntu:26.04@sha256:d66b366dac61b575bee2aef07e9c26e8070096fbe84a3d4d3eb0da069b5d76db
    timeout-minutes: 240
    env:
      SWIFT_URL: https://download.swift.org/swift-6.4.2-release/ubuntu2604-aarch64/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE-ubuntu26.04-aarch64.tar.gz
      SWIFT_SHA256: 54b2f791c815f4b8fe9371e85969a14269efe0dddb30a350773781fa8ebb220c
    steps:
      - name: git, and Swift for sdk-check
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates curl git build-essential libncurses6 libsqlite3-0 libxml2-16 libcurl4t64 > /dev/null
          curl -fsSLo /tmp/swift.tar.gz "$SWIFT_URL" && echo "$SWIFT_SHA256  /tmp/swift.tar.gz" | sha256sum -c -
          mkdir -p /opt/swift && tar -xzf /tmp/swift.tar.gz -C /opt/swift --strip-components=1 && rm /tmp/swift.tar.gz
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: /opt/swift/usr/bin/swift build --package-path sdk/check -c release
      # The sources by sha256, Staging's patches, configure, make and make
      # install; the archive and its .sha256 in out/wine, each step's log in
      # out/logs/build.
      - name: Wine, built
        run: sdk/check/.build/release/sdk-check wine-build --apt --out out/wine --logs out/logs/build
      # The archive unpacked at /opt (as the windows layer does), then its
      # sha256, wine --version, wineboot -i under Xvfb, cmd /c echo ok, an
      # arm64 hello world, Notepad's window.
      - name: Wine, checked
        run: sdk/check/.build/release/sdk-check wine-check --apt --archive out/wine/wine-*.tar.zst --out out/logs/check
      # Its commit main's head, which the draft targets.
      - name: The proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: sdk/check/.build/release/sdk-check wine-proof --checks out/logs/check --out out/proof
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wine-archive
          path: out/wine/
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wine-proof
          path: out/proof/
          retention-days: 1
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wine-logs
          path: out/logs/
          retention-days: 1

  # The Wine release's draft (sdk-check wine-draft, WineDraft.swift), the
  # only Wine job that writes: the proof compared with the last published
  # wine-* release's (build_tools' proof-diff, PROOF_TAG_PREFIX wine-), then
  # wine-<version>-staging drafted on the proof's commit (main's head, and
  # checked to be on main), or its draft updated, with the archive, its
  # .sha256, proof.zip and proof-diff.json.
  wine-draft:
    needs: wine
    # Drafted from isomer-6.4.2 alone (PR-only, by its exact name: an agent may create a new isomer-* branch at any
    # commit): a branch's recipe may be built and checked, never proposed. The PR moving the SDK's line changes this.
    if: github.ref == 'refs/heads/isomer-6.4.2'
    runs-on: ubuntu-24.04-arm
    container: ghcr.io/attilathefun/visor-agent@sha256:849dcf6aeb16119e3b769b4f0c410b93ac58ed1e3b3ef2801f7534def3fbaaf0
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wine-archive
          path: out/wine
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wine-proof
          path: out/proof
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: AttilaTheFun/build_tools
          ref: 3ce2a6b10df8e1fa0f41cc44378d67b8b5b5b6e4 # v0.2.0
          path: out/build_tools
      - env:
          GH_TOKEN: ${{ github.token }}
          PROOF_TAG_PREFIX: wine-
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          swift build --package-path sdk/check -c release && swift build --package-path out/build_tools -c release --product proof-diff
          out/build_tools/.build/release/proof-diff make out/proof/proof.zip
          sdk/check/.build/release/sdk-check wine-draft --assets out/wine --proof out/proof
